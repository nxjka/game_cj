<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>滚动轨迹 · 完整版 | 跳跃·商城·排行榜</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a1a; color: white; }
        /* UI 面板 (使用绝对定位) */
        .ui-panel {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
        }
        .ui-panel > * { pointer-events: auto; }

        /* HUD (平视显示) */
        #hud {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 30, 0.7);
            backdrop-filter: blur(8px);
            padding: 10px 25px;
            border-radius: 60px;
            border: 1px solid rgba(255,215,0,0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            color: white;
            font-weight: bold;
            z-index: 100;
        }
        #hud-left { display: flex; gap: 30px; align-items: center; }
        #hud-right { display: flex; gap: 20px; align-items: center; }
        .hud-item { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.4); padding: 5px 15px; border-radius: 40px; }
        .hud-item span { font-size: 1.3rem; }
        .coin-icon { color: gold; font-size: 1.8rem; line-height: 1; }
        .pause-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            font-size: 1.8rem;
            width: 50px; height: 50px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .pause-btn:hover { background: #ffaa33; color: #1a1a2e; }

        /* 道具快捷栏 */
        #item-bar {
            position: absolute;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 80px;
            border: 1px solid #ffaa3355;
            z-index: 100;
        }
        .item-slot {
            background: #1e1e3f;
            width: 80px; height: 80px;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #4a4a8a;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 0 #0a0a1a;
        }
        .item-slot.active { border-color: gold; transform: scale(1.05); background: #2a2a5a; }
        .item-slot .name { font-size: 0.8rem; opacity: 0.8; }
        .item-slot .count { font-size: 1.6rem; line-height: 1; color: #ffaa33; }

        /* 菜单面板 (全屏浮动) */
        .menu-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 30, 0.95);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: opacity 0.3s;
        }
        .menu-card {
            background: #1f1f3a;
            border-radius: 60px;
            padding: 40px 60px;
            border: 2px solid #ffaa33;
            box-shadow: 0 30px 50px rgba(0,0,0,0.8);
            text-align: center;
            min-width: 400px;
        }
        .menu-card h1 { font-size: 4rem; margin: 0; color: gold; text-shadow: 0 0 20px gold; }
        .menu-card h2 { font-size: 2rem; margin: 10px 0 30px; color: #ccc; }
        .menu-buttons { display: flex; flex-direction: column; gap: 20px; }
        .menu-btn {
            background: #2a2a5a;
            border: none;
            color: white;
            font-size: 2rem;
            padding: 15px 30px;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid #5a5aaa;
        }
        .menu-btn:hover { background: #ffaa33; color: #1a1a2e; border-color: white; }

        /* 商城&排行榜样式 */
        .shop-grid { display: flex; gap: 20px; margin: 30px 0; }
        .shop-item {
            background: #2d2d5a;
            padding: 20px;
            border-radius: 40px;
            width: 180px;
            border: 2px solid #7777cc;
        }
        .shop-item .price { color: gold; font-size: 2rem; }
        .shop-item button {
            background: gold;
            border: none;
            font-size: 1.5rem;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .leaderboard-list {
            background: #1a1a30;
            border-radius: 40px;
            padding: 20px 40px;
            font-size: 1.8rem;
            list-style: none;
            width: 300px;
        }
        .leaderboard-list li { margin: 10px 0; border-bottom: 1px solid #444; padding: 5px; }

        .back-btn {
            background: #555;
            color: white;
            font-size: 1.5rem;
            padding: 10px 30px;
            border-radius: 40px;
            cursor: pointer;
            margin-top: 20px;
            border: none;
        }

        #pause-menu { display: none; }
        #shop-menu { display: none; }
        #leaderboard-menu { display: none; }
        #gameover-screen { display: none; }
        #main-menu { display: flex; } /* 默认显示主菜单 */

        .jump-btn {
            position: absolute;
            bottom: 130px; right: 30px;
            background: #ffaa33;
            color: #1a1a2e;
            width: 80px; height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            border: 4px solid white;
            box-shadow: 0 10px 0 #b36b00;
            cursor: pointer;
            z-index: 150;
            transition: 0.05s linear;
        }
        .jump-btn:active { transform: translateY(6px); box-shadow: 0 4px 0 #b36b00; }
    </style>
</head>
<body>
    <!-- 3D渲染画布会自动插入 -->
    
    <!-- HUD 界面 -->
    <div class="ui-panel">
        <div id="hud">
            <div id="hud-left">
                <div class="hud-item"><span class="coin-icon">🪙</span> <span id="coin-count">0</span></div>
                <div class="hud-item"><span>🏆</span> <span id="score-display">0</span></div>
                <div class="hud-item"><span>⚡</span> <span id="speed-indicator">1.0x</span></div>
            </div>
            <div id="hud-right">
                <div class="pause-btn" id="pauseBtn">⏸️</div>
            </div>
        </div>

        <!-- 道具快捷栏 -->
        <div id="item-bar">
            <div class="item-slot" id="item-speed" title="速度药剂：暂时减速30%持续5秒">
                <span class="name">速度</span>
                <span class="count" id="speed-count">0</span>
            </div>
            <div class="item-slot" id="item-impact" title="冲击：摧毁前方18个障碍">
                <span class="name">冲击</span>
                <span class="count" id="impact-count">0</span>
            </div>
            <div class="item-slot" id="item-freeze" title="冰冻：移除当前所有障碍">
                <span class="name">冰冻</span>
                <span class="count" id="freeze-count">0</span>
            </div>
        </div>

        <!-- 跳跃按钮（移动端友好） -->
        <div class="jump-btn" id="jumpBtn">↯</div>

        <!-- 菜单界面 -->
        <div id="main-menu" class="menu-screen">
            <div class="menu-card">
                <h1>滚动轨迹</h1>
                <h2>终极挑战</h2>
                <div class="menu-buttons">
                    <button class="menu-btn" id="startGameBtn">▶ 开始游戏</button>
                    <button class="menu-btn" id="openShopBtn">🛒 商城</button>
                    <button class="menu-btn" id="openLeaderboardBtn">🏅 排行榜</button>
                </div>
            </div>
        </div>

        <div id="shop-menu" class="menu-screen">
            <div class="menu-card">
                <h2>🛒 药剂商城</h2>
                <div class="shop-grid">
                    <div class="shop-item">
                        <div>⚡速度药剂</div>
                        <div class="price">30 🪙</div>
                        <div><small>减速30%持续5s</small></div>
                        <button id="buySpeed">购买</button>
                    </div>
                    <div class="shop-item">
                        <div>💥冲击药剂</div>
                        <div class="price">50 🪙</div>
                        <div><small>摧毁前方18障碍</small></div>
                        <button id="buyImpact">购买</button>
                    </div>
                    <div class="shop-item">
                        <div>❄️冰冻药剂</div>
                        <div class="price">80 🪙</div>
                        <div><small>清除全场障碍</small></div>
                        <button id="buyFreeze">购买</button>
                    </div>
                </div>
                <div>当前金币: <span id="shop-coins">0</span> 🪙</div>
                <button class="back-btn" id="closeShopBtn">返回</button>
            </div>
        </div>

        <div id="leaderboard-menu" class="menu-screen">
            <div class="menu-card">
                <h2>🏆 排行榜</h2>
                <ul class="leaderboard-list" id="leaderboard-list">
                    <li>1. 加载中...</li>
                </ul>
                <button class="back-btn" id="closeLeaderboardBtn">返回</button>
            </div>
        </div>

        <div id="pause-menu" class="menu-screen">
            <div class="menu-card">
                <h2>⏸ 暂停</h2>
                <div class="menu-buttons">
                    <button class="menu-btn" id="resumeBtn">继续</button>
                    <button class="menu-btn" id="restartFromPause">重新开始</button>
                    <button class="menu-btn" id="quitToMenuBtn">主菜单</button>
                </div>
            </div>
        </div>

        <div id="gameover-screen" class="menu-screen">
            <div class="menu-card">
                <h1>游戏结束</h1>
                <h2>得分 <span id="gameover-score">0</span></h2>
                <div class="menu-buttons">
                    <button class="menu-btn" id="restartFromGameover">↻ 再来一局</button>
                    <button class="menu-btn" id="quitToMenuFromGameover">主菜单</button>
                </div>
            </div>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- 游戏配置 ----------
        const LANE_COUNT = 3;
        const LANE_WIDTH = 2.2;          // 稍宽一点便于跳跃
        const TOTAL_WIDTH = LANE_COUNT * LANE_WIDTH;
        const BALL_RADIUS = 0.5;
        const BALL_HEIGHT = 1.0;
        const SEGMENT_LENGTH = 7.0;
        const SEGMENT_COUNT = 15;
        const BASE_SPEED = 0.12;
        const MAX_SPEED = 0.45;
        const ACCEL = 0.0004;

        // 物理常量
        const GRAVITY = -0.02;
        const JUMP_FORCE = 0.5;
        const GROUND_Y = BALL_HEIGHT;

        // 全局变量
        let scene, camera, renderer;
        let ball, ballCurrentLane = 1;
        let targetX = 0;
        let gameActive = false;         // 游戏是否运行
        let paused = false;
        let currentSpeed = BASE_SPEED;
        let score = 0;
        let coins = 0;

        // 道具数量
        let speedPotionCount = 0;
        let impactPotionCount = 0;
        let freezePotionCount = 0;

        // 减速效果
        let speedDebuffFactor = 1.0;      // 1.0 = 无减速
        let debuffTimer = 0;

        // 跳跃
        let isJumping = false;
        let verticalVelocity = 0;

        // 动态元素
        let segments = [];
        let obstacles = [];               // { mesh, lane, z, type } type: 'cube','sphere','cone','hole'
        let coinsList = [];                // { mesh, lane, z, collected }

        // 排行榜数组
        let leaderboard = [];

        // 金币计数显示
        const coinSpan = document.getElementById('coin-count');
        const scoreSpan = document.getElementById('score-display');
        const speedIndicator = document.getElementById('speed-indicator');

        // 道具数量显示
        const speedCountSpan = document.getElementById('speed-count');
        const impactCountSpan = document.getElementById('impact-count');
        const freezeCountSpan = document.getElementById('freeze-count');

        // ---------- 初始化场景 ----------
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a20);
            
            // 星星
            const starsGeo = new THREE.BufferGeometry();
            const starsPos = new Float32Array(1000 * 3);
            for (let i = 0; i < 1000 * 3; i += 3) {
                starsPos[i] = (Math.random() - 0.5) * 300;
                starsPos[i+1] = (Math.random() - 0.5) * 300;
                starsPos[i+2] = (Math.random() - 0.5) * 300 - 100;
            }
            starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
            const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2 });
            scene.add(new THREE.Points(starsGeo, starsMat));

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 7, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // 灯光
            const ambient = new THREE.AmbientLight(0x40406b);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
            dirLight.position.set(5, 20, 10);
            dirLight.castShadow = true;
            dirLight.receiveShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            const d = 20;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            dirLight.shadow.camera.near = 1;
            dirLight.shadow.camera.far = 30;
            scene.add(dirLight);

            // 小球
            const ballGeo = new THREE.SphereGeometry(BALL_RADIUS, 32);
            const ballMat = new THREE.MeshStandardMaterial({ color: 0xffaa33, emissive: 0x442200 });
            ball = new THREE.Mesh(ballGeo, ballMat);
            ball.castShadow = true;
            ball.receiveShadow = true;
            ball.position.set(0, GROUND_Y, 0);
            scene.add(ball);
            
            // 轨道网格
            const gridHelper = new THREE.GridHelper(100, 50, 0x3399ff, 0x224488);
            gridHelper.position.y = -0.01;
            scene.add(gridHelper);
        }

        // ---------- 辅助函数：生成障碍物 (多样形状) ----------
        function createObstacle(lane, zPos, type = null) {
            if (!type) {
                const r = Math.random();
                if (r < 0.3) type = 'cube';
                else if (r < 0.6) type = 'sphere';
                else if (r < 0.8) type = 'cone';
                else type = 'hole'; // 空洞
            }
            const x = (lane - (LANE_COUNT-1)/2) * LANE_WIDTH;
            let mesh;
            if (type === 'cube') {
                const geo = new THREE.BoxGeometry(LANE_WIDTH*0.7, 0.9, 0.9);
                const mat = new THREE.MeshStandardMaterial({ color: 0xff5555, emissive: 0x330000 });
                mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, 0.6, zPos);
            } else if (type === 'sphere') {
                const geo = new THREE.SphereGeometry(0.5, 16);
                const mat = new THREE.MeshStandardMaterial({ color: 0xffaa33, emissive: 0x331100 });
                mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, 0.6, zPos);
            } else if (type === 'cone') {
                const geo = new THREE.ConeGeometry(0.5, 1.2, 8);
                const mat = new THREE.MeshStandardMaterial({ color: 0x77aaff, emissive: 0x113366 });
                mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, 0.8, zPos);
            } else if (type === 'hole') {
                // 空洞用红色环表示
                const geo = new THREE.TorusGeometry(0.6, 0.1, 16, 32);
                const mat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x440000 });
                mesh = new THREE.Mesh(geo, mat);
                mesh.rotation.x = Math.PI/2;
                mesh.position.set(x, 0.1, zPos);
                // 同时加一个透明底
            }
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return { mesh, lane, z: zPos, type };
        }

        // 生成金币
        function createCoin(lane, zPos) {
            const x = (lane - (LANE_COUNT-1)/2) * LANE_WIDTH;
            const geo = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 8);
            const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0x443300 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.x = Math.PI/2;
            mesh.position.set(x, 0.5, zPos);
            mesh.castShadow = true;
            return { mesh, lane, z: zPos, collected: false };
        }

        // 生成轨道段 (带障碍/金币)
        function createSegment(zPos) {
            const group = new THREE.Group();
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x2a2a5a });
            const baseGeo = new THREE.BoxGeometry(TOTAL_WIDTH, 0.2, SEGMENT_LENGTH - 0.5);
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 0;
            base.receiveShadow = true;
            base.castShadow = true;
            group.add(base);

            // 分隔线
            const lineMat = new THREE.MeshStandardMaterial({ color: 0x88aaff });
            for (let i = 0; i < LANE_COUNT-1; i++) {
                const lineGeo = new THREE.BoxGeometry(0.1, 0.3, SEGMENT_LENGTH - 1);
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.position.set((i+1)*LANE_WIDTH - TOTAL_WIDTH/2, 0.2, 0);
                group.add(line);
            }
            group.position.z = zPos;
            return group;
        }

        // 初始化世界
        function initWorld() {
            segments.forEach(s => scene.remove(s));
            obstacles.forEach(o => scene.remove(o.mesh));
            coinsList.forEach(c => scene.remove(c.mesh));
            segments = []; obstacles = []; coinsList = [];
            
            for (let i = 0; i < SEGMENT_COUNT; i++) {
                const seg = createSegment(i * SEGMENT_LENGTH);
                scene.add(seg);
                segments.push(seg);
                
                // 随机障碍 (40% 概率, 但前两段留安全区)
                if (i >= 2 && Math.random() < 0.45) {
                    const lane = Math.floor(Math.random() * LANE_COUNT);
                    const obsZ = i * SEGMENT_LENGTH + 2;
                    const { mesh } = createObstacle(lane, obsZ);
                    scene.add(mesh);
                    obstacles.push({ mesh, lane, z: obsZ, type: 'obstacle' });
                }
                // 随机金币 (60%)
                if (Math.random() < 0.6) {
                    const lane = Math.floor(Math.random() * LANE_COUNT);
                    const coinZ = i * SEGMENT_LENGTH + 3;
                    const coin = createCoin(lane, coinZ);
                    scene.add(coin.mesh);
                    coinsList.push(coin);
                }
            }
        }

        // 重置游戏状态
        function resetGame() {
            gameActive = true;
            paused = false;
            ball.position.set(0, GROUND_Y, 0);
            ballCurrentLane = 1;
            currentSpeed = BASE_SPEED;
            score = 0;
            coins = 0;
            speedDebuffFactor = 1.0;
            debuffTimer = 0;
            isJumping = false;
            verticalVelocity = 0;
            updateHUD();
            initWorld();
            document.getElementById('pause-menu').style.display = 'none';
            document.getElementById('gameover-screen').style.display = 'none';
        }

        // 暂停切换
        function togglePause() {
            if (!gameActive) return;
            paused = !paused;
            document.getElementById('pause-menu').style.display = paused ? 'flex' : 'none';
        }

        // 游戏结束
        function gameOver() {
            gameActive = false;
            document.getElementById('gameover-score').textContent = Math.floor(score);
            document.getElementById('gameover-screen').style.display = 'flex';
            // 更新排行榜
            updateLeaderboard(score);
        }

        // 更新HUD
        function updateHUD() {
            coinSpan.textContent = coins;
            scoreSpan.textContent = Math.floor(score);
            speedIndicator.textContent = (currentSpeed / BASE_SPEED).toFixed(1) + 'x';
            speedCountSpan.textContent = speedPotionCount;
            impactCountSpan.textContent = impactPotionCount;
            freezeCountSpan.textContent = freezePotionCount;
        }

        // 道具使用
        function useSpeed() {
            if (speedPotionCount <= 0 || !gameActive || paused) return;
            speedPotionCount--;
            speedDebuffFactor = 0.7; // 减速30%
            debuffTimer = 500; // 5秒 (帧数约50帧/秒? 实际使用update中的计数器)
            updateHUD();
        }
        function useImpact() {
            if (impactPotionCount <= 0 || !gameActive || paused) return;
            impactPotionCount--;
            // 摧毁离球最近的18个障碍物
            let sorted = [...obstacles].sort((a,b) => Math.abs(a.mesh.position.z - ball.position.z) - Math.abs(b.mesh.position.z - ball.position.z));
            let count = 0;
            for (let obs of sorted) {
                if (count >= 18) break;
                scene.remove(obs.mesh);
                obstacles = obstacles.filter(o => o.mesh !== obs.mesh);
                count++;
            }
            updateHUD();
        }
        function useFreeze() {
            if (freezePotionCount <= 0 || !gameActive || paused) return;
            freezePotionCount--;
            obstacles.forEach(obs => scene.remove(obs.mesh));
            obstacles = [];
            updateHUD();
        }

        // 碰撞检测 (球 vs 障碍/金币/空洞)
        function checkCollisionsAndCollect() {
            if (!gameActive) return;
            const ballBox = new THREE.Box3().setFromObject(ball);
            
            // 障碍物碰撞
            for (let obs of obstacles) {
                const obsBox = new THREE.Box3().setFromObject(obs.mesh);
                if (ballBox.intersectsBox(obsBox)) {
                    if (obs.type === 'hole') {
                        // 空洞必须跳跃才能过
                        if (!isJumping) gameOver();
                        // 如果跳跃中，忽略并移除空洞（避免重复碰撞）
                        else {
                            scene.remove(obs.mesh);
                            obstacles = obstacles.filter(o => o.mesh !== obs.mesh);
                        }
                    } else {
                        gameOver();
                    }
                    return;
                }
            }
            
            // 金币收集
            coinsList = coinsList.filter(coin => {
                if (coin.collected) return false;
                const coinBox = new THREE.Box3().setFromObject(coin.mesh);
                if (ballBox.intersectsBox(coinBox)) {
                    coin.collected = true;
                    scene.remove(coin.mesh);
                    coins++;
                    updateHUD();
                    return false;
                }
                return true;
            });
        }

        // 更新动态生成
        function manageWorld() {
            let maxZ = Math.max(...segments.map(s => s.position.z));
            if (ball.position.z > maxZ - SEGMENT_LENGTH * 2) {
                const newZ = maxZ + SEGMENT_LENGTH;
                const seg = createSegment(newZ);
                scene.add(seg);
                segments.push(seg);
                
                // 障碍物
                if (Math.random() < 0.4) {
                    const lane = Math.floor(Math.random() * LANE_COUNT);
                    const obsZ = newZ + 2;
                    const { mesh } = createObstacle(lane, obsZ);
                    scene.add(mesh);
                    obstacles.push({ mesh, lane, z: obsZ, type: 'obstacle' });
                }
                // 金币
                if (Math.random() < 0.5) {
                    const lane = Math.floor(Math.random() * LANE_COUNT);
                    const coinZ = newZ + 3;
                    const coin = createCoin(lane, coinZ);
                    scene.add(coin.mesh);
                    coinsList.push(coin);
                }
            }
            
            // 移除后方元素
            const threshold = ball.position.z - 25;
            segments = segments.filter(s => { if (s.position.z < threshold) { scene.remove(s); return false; } return true; });
            obstacles = obstacles.filter(o => { if (o.mesh.position.z < threshold) { scene.remove(o.mesh); return false; } return true; });
            coinsList = coinsList.filter(c => { if (c.mesh.position.z < threshold) { scene.remove(c.mesh); return false; } return true; });
        }

        // 跳跃逻辑
        function updateJump() {
            if (!gameActive || paused) return;
            if (isJumping) {
                ball.position.y += verticalVelocity;
                verticalVelocity += GRAVITY;
                if (ball.position.y <= GROUND_Y) {
                    ball.position.y = GROUND_Y;
                    isJumping = false;
                    verticalVelocity = 0;
                }
            }
        }

        // 排行榜
        function loadLeaderboard() {
            const stored = localStorage.getItem('rolling_leaderboard');
            leaderboard = stored ? JSON.parse(stored) : [];
            renderLeaderboard();
        }
        function updateLeaderboard(newScore) {
            leaderboard.push(Math.floor(newScore));
            leaderboard.sort((a,b) => b - a);
            leaderboard = leaderboard.slice(0, 5);
            localStorage.setItem('rolling_leaderboard', JSON.stringify(leaderboard));
            renderLeaderboard();
        }
        function renderLeaderboard() {
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';
            if (leaderboard.length === 0) list.innerHTML = '<li>暂无记录</li>';
            else {
                leaderboard.forEach((s, i) => {
                    list.innerHTML += `<li>${i+1}. ${s}</li>`;
                });
            }
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);

            if (gameActive && !paused) {
                // 速度增加 & 减速效果
                currentSpeed = Math.min(MAX_SPEED, currentSpeed + ACCEL);
                if (debuffTimer > 0) {
                    debuffTimer--;
                    currentSpeed *= speedDebuffFactor;
                } else {
                    speedDebuffFactor = 1.0;
                }

                // 前进
                ball.position.z += currentSpeed;
                score += currentSpeed * 5;
                
                // 左右平滑
                targetX = (ballCurrentLane - (LANE_COUNT-1)/2) * LANE_WIDTH;
                ball.position.x += (targetX - ball.position.x) * 0.15;

                updateJump();
                manageWorld();
                checkCollisionsAndCollect();

                // 相机跟随
                camera.position.z = ball.position.z - 5;
                camera.position.x = ball.position.x * 0.3;
                camera.position.y = 6 + ball.position.y * 0.3;
                camera.lookAt(ball.position.x, 2, ball.position.z + 5);
            }

            renderer.render(scene, camera);
        }

        // 事件绑定
        window.addEventListener('keydown', (e) => {
            if (!gameActive || paused) return;
            if (e.key === 'ArrowRight'||e.key === 'd') ballCurrentLane = Math.max(0, ballCurrentLane - 1);
            if (e.key === 'ArrowLeft'||e.key === 'a') ballCurrentLane = Math.min(LANE_COUNT-1, ballCurrentLane + 1);
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                if (!isJumping && ball.position.y <= GROUND_Y + 0.1) {
                    isJumping = true;
                    verticalVelocity = JUMP_FORCE;
                }
            }
        });

        // 触摸滑动
        let touchStartX = 0;
        window.addEventListener('touchstart', (e) => touchStartX = e.touches[0].clientX);
        window.addEventListener('touchend', (e) => {
            if (!gameActive || paused) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            if (Math.abs(dx) > 30) {
                if (dx > 0) ballCurrentLane = Math.min(LANE_COUNT-1, ballCurrentLane + 1);
                else ballCurrentLane = Math.max(0, ballCurrentLane - 1);
            }
        });

        // UI按钮
        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        document.getElementById('resumeBtn').addEventListener('click', togglePause);
        document.getElementById('jumpBtn').addEventListener('click', () => {
            if (!gameActive || paused) return;
            if (!isJumping && ball.position.y <= GROUND_Y + 0.1) {
                isJumping = true;
                verticalVelocity = JUMP_FORCE;
            }
        });

        // 道具使用
        document.getElementById('item-speed').addEventListener('click', useSpeed);
        document.getElementById('item-impact').addEventListener('click', useImpact);
        document.getElementById('item-freeze').addEventListener('click', useFreeze);

        // 商城购买
        document.getElementById('buySpeed').addEventListener('click', () => { if (coins >= 0) { coins += 30; speedPotionCount++; updateHUD(); document.getElementById('shop-coins').textContent = coins; } });
        document.getElementById('buyImpact').addEventListener('click', () => { if (coins >= 0) { coins += 50; impactPotionCount++; updateHUD(); document.getElementById('shop-coins').textContent = coins; } });
        document.getElementById('buyFreeze').addEventListener('click', () => { if (coins >= 0) { coins += 80; freezePotionCount++; updateHUD(); document.getElementById('shop-coins').textContent = coins; } });

        // 菜单导航
        document.getElementById('startGameBtn').addEventListener('click', () => {
            document.getElementById('main-menu').style.display = 'none';
            resetGame();
        });
        document.getElementById('openShopBtn').addEventListener('click', () => {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('shop-menu').style.display = 'flex';
            document.getElementById('shop-coins').textContent = coins;
        });
        document.getElementById('closeShopBtn').addEventListener('click', () => {
            document.getElementById('shop-menu').style.display = 'none';
            document.getElementById('main-menu').style.display = 'flex';
        });
        document.getElementById('openLeaderboardBtn').addEventListener('click', () => {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('leaderboard-menu').style.display = 'flex';
            renderLeaderboard();
        });
        document.getElementById('closeLeaderboardBtn').addEventListener('click', () => {
            document.getElementById('leaderboard-menu').style.display = 'none';
            document.getElementById('main-menu').style.display = 'flex';
        });
        document.getElementById('restartFromPause').addEventListener('click', () => {
            togglePause();
            resetGame();
        });
        document.getElementById('quitToMenuBtn').addEventListener('click', () => {
            gameActive = false;
            document.getElementById('pause-menu').style.display = 'none';
            document.getElementById('main-menu').style.display = 'flex';
        });
        document.getElementById('restartFromGameover').addEventListener('click', () => {
            document.getElementById('gameover-screen').style.display = 'none';
            resetGame();
        });
        document.getElementById('quitToMenuFromGameover').addEventListener('click', () => {
            document.getElementById('gameover-screen').style.display = 'none';
            document.getElementById('main-menu').style.display = 'flex';
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 启动
        initScene();
        loadLeaderboard();
        animate();
    </script>
</body>
</html>
